name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Inboxwell.slnx
      - name: Test
        run: dotnet test tests/Gomail.Tests/Gomail.Tests.csproj -c Release --no-restore
      - name: Build
        run: dotnet build Inboxwell.slnx -c Release --no-restore -p:GenerateAppxPackageOnBuild=false
